<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Temporary responsive layout audit</title></head>
<body>
<h1>Temporary responsive layout audit</h1>
<p id="progress">Preparing device-width checks…</p>
<pre id="results"></pre>
<script>
  const checks = [
    ...[320, 360, 390, 430, 768, 820, 1024, 1180, 1280, 1440].map(width => ({ path: '/', width })),
    ...[320, 390, 768, 1024, 1280].map(width => ({ path: '/business-systems-automation', width })),
  ];
  const results = [];
  async function run() {
    for (const check of checks) {
      document.getElementById('progress').textContent = `Checking ${check.path} at ${check.width}px…`;
      const frame = document.createElement('iframe');
      frame.width = String(check.width);
      frame.height = '900';
      frame.setAttribute('scrolling', 'no');
      frame.style.position = 'absolute';
      frame.style.left = '-99999px';
      frame.style.border = '0';
      const ready = new Promise(resolve => frame.addEventListener('load', resolve, { once: true }));
      frame.src = check.path;
      document.body.appendChild(frame);
      await ready;
      await new Promise(resolve => setTimeout(resolve, 400));
      const doc = frame.contentDocument;
      const win = frame.contentWindow;
      const nav = doc.querySelector('header nav');
      const menuButton = nav?.querySelector('button');
      const desktopLinks = nav?.querySelector('div.hidden');
      const hero = doc.querySelector('h1');
      results.push({
        path: check.path,
        width: check.width,
        viewport: doc.documentElement.clientWidth,
        scroll: doc.documentElement.scrollWidth,
        overflow: doc.documentElement.scrollWidth - doc.documentElement.clientWidth,
        heading: hero?.textContent?.trim(),
        headingSize: hero ? win.getComputedStyle(hero).fontSize : null,
        mobileMenu: menuButton ? win.getComputedStyle(menuButton).display !== 'none' : false,
        desktopNavigation: desktopLinks ? win.getComputedStyle(desktopLinks).display !== 'none' : false,
      });
      frame.remove();
    }
    document.getElementById('progress').textContent = 'Complete';
    document.getElementById('results').textContent = JSON.stringify(results);
    window.__responsiveAuditDone = true;
  }
  run().catch(error => document.getElementById('results').textContent = JSON.stringify({ error: error.message }));
</script>
</body>
</html>
